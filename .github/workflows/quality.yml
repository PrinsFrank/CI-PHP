name: Quality

on:
  workflow_call:
    inputs:
      PHP_VERSION:
        required: true
        type: string
      PHP_VERSIONS:
        required: false
        type: string
        default: '[8.1, 8.2, 8.3]'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

env:
  PHPSTAN_CACHE_DIR: './cache/.phpstan.result.cache'
  PHPUNIT_CACHE_DIR: './cache/.phpunit.result.cache'
  PHP_CS_FIXER_CACHE_PATH: './cache/.php-cs-fixer.cache'
  COVERAGE_PATH: 'coverage.xml'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  COMPOSER_ROOT_VERSION: dev-main # see https://getcomposer.org/doc/articles/troubleshooting.md#dependencies-on-the-root-package

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.PHP_VERSION }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  composer-psr:
    name: Check namespaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Check PSR-4 mapping
        run: composer dump-autoload --dev --optimize --strict-psr

  php-code-style:
    name: PHP Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Load php-cs-fixer cache
        id: php-cs-fixer-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PHP_CS_FIXER_CACHE_PATH }}
          key: php-cs-fixer-${{ github.ref_name }}
          restore-keys: |
            php-cs-fixer-

      - name: Check code style
        run: composer run cs

      - name: Push php-cs-fixer branch cache
        id: push-php-cs-fixer-cache-branch
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PHP_CS_FIXER_CACHE_PATH }}
          key: php-cs-fixer-${{ github.ref_name }}

  php-stan:
    name: PHP Stan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Pull PHPStan cache
        id: pull-phpstan-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PHPSTAN_CACHE_DIR }}
          key: phpstan-${{ github.ref_name }}
          restore-keys: |
            phpstan

      - name: Run PHPStan
        run: composer run stan

      - name: Clear previous version of PHPStan branch cache
        if: always() # We always delete the cache, because even if it was not 'hit', it might have been created by a commit in the meantime
        continue-on-error: true
        env:
          REF_NAME: ${{ github.ref_name }}
        run: gh cache delete phpstan-$REF_NAME

      - name: Push PHPStan branch cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PHPSTAN_CACHE_DIR }}
          key: phpstan-${{ github.ref_name }}

      - name: Clear previous version of PHPStan main cache
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        run: gh cache delete phpstan

      - name: Push PHPStan main cache
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PHPSTAN_CACHE_DIR }}
          key: phpstan

  php-unit:
    name: PHP Tests - Unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        php-version: ${{ fromJSON(inputs.PHP_VERSIONS) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Unit tests
        run: composer run unit

  php-coverage:
    name: PHP Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.PHP_VERSION }}
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Unit tests
        env:
          COVERAGE_PATH: ${{ env.COVERAGE_PATH }}
        run: vendor/bin/phpunit --coverage-clover=$COVERAGE_PATH

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: ${{ env.COVERAGE_PATH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: parallel-lint,cs2pr

      - name: Lint files
        run: parallel-lint --checkstyle . | cs2pr

  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check EditorConfig configuration
        run: test -f .editorconfig

      - name: Check adherence to EditorConfig
        uses: greut/eclint-action@b9844795dd0b5fb19e3c60bd731fd3e548524b5c #v0.5.0

  typos:
    name: Typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Search for misspellings
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  completed:
    name: Quality-Done # Used as a required workflow name
    runs-on: ubuntu-latest
    needs:
      - composer-validate
      - composer-psr
      - php-code-style
      - php-stan
      - php-unit
      - php-coverage
      - php-lint
      - editorconfig
      - typos
    steps:
      - run: echo 'completed'
